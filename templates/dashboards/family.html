{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Family Dashboard — AgeWell360</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
  <style>
    .dashboard-container {
      max-width: 800px;
      margin: 60px auto;
      padding: 40px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      text-align: center;
    }
    .dashboard-container h1 {
      color: #333;
      font-size: 32px;
      margin-bottom: 20px;
    }
    .dashboard-container p {
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    .btn-logout {
      display: inline-block;
      padding: 12px 30px;
      background: #dc3545;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 16px;
      border: none;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn-logout:hover {
      background: #c82333;
    }
  </style>
</head>
<body>
  <main>
    <div class="dashboard-container">
      <h1>Welcome Family Member</h1>
      <p>This is a temporary interface. Features will be added in the next phase.</p>
      <a href="{% url 'logout' %}" class="btn-logout">Logout</a>
    </div>
  </main>
</body>
</html>
