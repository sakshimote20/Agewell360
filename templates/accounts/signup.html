{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create Account — AgeWell360</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=2">
</head>
<body>

<main class="auth-bg" style="background-image: url('{% static "images/elderly-care.jpg" %}');">
  <div class="auth-overlay" aria-hidden="true"></div>

  <section class="auth-wrapper" role="region" aria-labelledby="auth-title">
    <h1 id="auth-title">Create Account</h1>

    {% if messages %}
      <ul class="messages" aria-live="polite">
        {% for message in messages %}
          <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    <form method="post" class="auth-form" novalidate>
      {% csrf_token %}

      <div class="input-group select-wrapper">
        <span class="input-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v6m0 6v2m7.07-10.07l-4.24 4.24m5.65 5.66l-4.24-4.24M4.93 4.93l4.24 4.24M3.28 16.38l4.24-4.24" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <select id="role" name="role" required>
          <option value="" disabled selected>Select Role</option>
          <option value="elderly">Elderly User</option>
          <option value="caregiver">Caregiver</option>
          <option value="family">Family Member</option>
          <option value="doctor">Doctor</option>
        </select>
      </div>

      <div class="input-group">
        <span class="input-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#6b6b6b" stroke-width="1.2"/><path d="M3 7l9 6 9-6" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <input id="email_phone" type="text" name="email_phone" placeholder="Enter your email or phone number" required>
      </div>

      <div class="input-group">
        <span class="input-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="3" y="11" width="18" height="11" rx="2" stroke="#6b6b6b" stroke-width="1.2"/><path d="M7 11V8a5 5 0 0110 0v3" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <input id="password" type="password" name="password" placeholder="Password" required autocomplete="new-password">
      </div>

      <div class="input-group">
        <span class="input-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3v6" stroke="#6b6b6b" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="16" r="3" stroke="#6b6b6b" stroke-width="1.2"/></svg>
        </span>
        <input id="password2" type="password" name="password2" placeholder="Confirm password" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn-primary">Sign Up</button>
    </form>

    <p class="auth-actions">Already have an account? <a href="{% url 'login' %}">Login</a></p>
  </section>
</main>

</body>
</html>
